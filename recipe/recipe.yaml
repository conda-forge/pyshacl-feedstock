# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.40.0"
  summary: A Python validator for SHACL
  cov_run: coverage run --branch --source=pyshacl --append

recipe:
  name: pyshacl
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyshacl/pyshacl-${{ version }}.tar.gz
  sha256: d9cd86f108266a157162afb69a106689c868388e5d7be80c1fcf16070cf6ad08

build:
  number: 0
  noarch: python

outputs:
  - package:
      name: pyshacl
    build:
      script:
        - ${{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation --disable-pip-version-check
        - cd ${{ RECIPE_DIR }} && ${{ PYTHON }} clean_site_packages.py
      python:
        entry_points:
          - pyshacl = pyshacl.cli:main
          - pyshacl_rules = pyshacl.cli_rules:main
          - pyshacl_server = pyshacl.http:cli
          - pyshacl_validate = pyshacl.cli:main
    requirements:
      host:
        - pip
        - poetry-core >=2,<3
        - python ${{ python_min }}.*
      run:
        - importlib-metadata >6
        - owlrl >=7.6.2,<8
        - packaging >=21.3
        - prettytable >=3.7.0
        - python >=${{ python_min }}
        - rdflib-with-html >=7.3.0,<8.0
    tests:
      - python:
          pip_check: true
          python_version: ${{ python_min }}.*
          imports:
            - pyshacl
      - requirements:
          run:
            - python ${{ python_min }}.*
        script:
          - pyshacl --help

  - package:
      name: pyshacl-with-http
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("pyshacl", exact=True) }}
        - sanic >=22.12,<23
        - sanic-cors 2.2.0.*
        - sanic-ext >=23.3,<23.6
    tests:
      - python:
          pip_check: true
          python_version: ${{ python_min }}.*
          imports:
            - pyshacl
            - pyshacl.sh_http
      - requirements:
          run:
            - python ${{ python_min }}.*
        script:
          - pyshacl --help
    about:
      summary: ${{ summary }} (with [http])

  - package:
      name: pyshacl-with-js
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("pyshacl", exact=True) }}
        - pyduktape2 >=0.5.0,<1
    tests:
      - python:
          pip_check: true
          python_version: ${{ python_min }}.*
          imports:
            - pyshacl
            - pyshacl.extras.js.context
      - requirements:
          run:
            - python ${{ python_min }}.*
        script:
          - pyshacl --help
    about:
      summary: ${{ summary }} (with [js])

  - package:
      name: pyshacl-with-oxigraph
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("pyshacl", exact=True) }}
        - pyoxigraph >=0.5.6
    tests:
      - python:
          pip_check: true
          python_version: ${{ python_min }}.*
          imports:
            - pyshacl
      - requirements:
          run:
            - python ${{ python_min }}.*
        script:
          - pyshacl --help
          - python -c "from pyshacl.graph_abstraction import OxigraphDataGraph"
    about:
      summary: ${{ summary }} (with [oxigraph])

  - package:
      name: pyshacl-with-all
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("pyshacl-with-http", exact=True) }}
        - ${{ pin_subpackage("pyshacl-with-js", exact=True) }}
        - ${{ pin_subpackage("pyshacl-with-oxigraph", exact=True) }}
        - ${{ pin_subpackage("pyshacl", exact=True) }}
    tests:
      - python:
          pip_check: true
          python_version: ${{ python_min }}.*
          imports:
            - pyshacl
      - files:
          source:
            - test/
        requirements:
          run:
            - python ${{ python_min }}.*
            - pytest-cov
        script:
          - pyshacl --help
          - ${{ cov_run }} -m pyshacl.cli --help
          - ${{ cov_run }} -m pytest -vv --color=yes --tb=long -k "not owl_imports"
          - coverage report --show-missing --skip-covered --fail-under=70
    about:
      summary: ${{ summary }} (with [all])

about:
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: ${{ summary }}
  description: |
    This is a pure Python module which allows for the validation of RDF graphs
    against Shapes Constraint Language (SHACL) graphs. This module uses the
    rdflib Python library for working with RDF and is dependent on the OWL-RL
    Python module for OWL2 RL Profile-based expansion of data graphs.
  homepage: https://pypi.org/project/pyshacl
  repository: https://github.com/RDFLib/pySHACL

extra:
  feedstock-name: pyshacl
  recipe-maintainers:
    - bollwyvl
    - satra
